<!DOCTYPE html>
<html lang="th"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขอราคาพิเศษ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#14212b;--mute:#52606d;--line:#cbd5df;--acc:#0b5d7a;--acc-ink:#fff;--soft:#e3f1f6;--ok:#146c3a;--okbg:#dff5e8;--bad:#a61b1b;--badbg:#fde4e4;--warnbg:#fff1cf;--warn:#7a5200;
box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#eef3f7;--mute:#a8b6c3;--line:#34444f;--acc:#5cc3e6;--acc-ink:#06232e;--soft:#16323d;--ok:#6fdc9b;--okbg:#12361f;--bad:#ff8f8f;--badbg:#431a1a;--warnbg:#3d3010;--warn:#ffd27a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Sarabun",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px;max-width:720px;margin:0 auto}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:700}
a.data{flex:none;background:var(--acc);color:var(--acc-ink);text-decoration:none;font-weight:700;padding:10px 18px;border-radius:10px;font-size:16px}
main{max-width:720px;margin:0 auto;padding:8px 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
h2{font-size:19px;margin:0 0 4px;font-weight:700}
.hint{color:var(--mute);font-size:15px;margin:0 0 8px}
label{display:block;font-weight:500;margin:14px 0 5px}
input,select{width:100%;min-height:50px;padding:10px 12px;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input[readonly]{background:var(--soft);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.two{grid-template-columns:1fr}}
.box{border-radius:12px;padding:14px;margin-top:14px;font-size:17px}
.box.info{background:var(--soft)}
.box b{font-size:22px}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.item{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.item .top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.item .top button{min-height:40px;padding:4px 14px;margin:0}
.buy{margin-top:10px;font-size:16px;color:var(--mute)}
.buy b{color:var(--ink)}
button{font:inherit;font-weight:700;min-height:50px;padding:10px 18px;border-radius:10px;border:2px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer}
button.full{width:100%;margin-top:12px}
button.rm{border-color:var(--bad);color:var(--bad)}
table.sum{width:100%;border-collapse:collapse;margin-top:6px}
table.sum td{padding:9px 0;border-bottom:1px solid var(--line)}
table.sum td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
table.sum tr.big td{font-size:20px;border-bottom:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:720px;margin:0 auto}
#save{width:100%;background:var(--acc);color:var(--acc-ink);font-size:19px;min-height:54px}
#save:disabled{opacity:.5}
#msg{margin:0 0 8px;padding:10px 12px;border-radius:10px;font-weight:500;display:none}
#msg.ok{display:block;background:var(--okbg);color:var(--ok)}
#msg.bad{display:block;background:var(--badbg);color:var(--bad)}
#msg.warn{display:block;background:var(--warnbg);color:var(--warn)}
.hide{display:none}
</style></head><body>
<header><h1>ขอราคาพิเศษ</h1><a class="data" id="dataLink" href="#" target="_blank" rel="noopener">DATA</a></header>
<main>

<section>
 <h2>ลูกค้า</h2>
 <label for="code">รหัสลูกค้า</label><input id="code" autocomplete="off" autocapitalize="characters">
 <label for="cname">ชื่อลูกค้า</label><input id="cname" autocomplete="off">
 <div class="two">
  <div><label for="ctype">ประเภทลูกค้า</label><select id="ctype"></select></div>
  <div><label for="cont">หน้างานต่อเนื่อง</label><select id="cont"></select></div>
 </div>
 <label for="cum">ยอดซื้อสะสม (บาท)</label><input id="cum" type="number" inputmode="decimal" step="any">
 <div id="stats" class="box info hide"></div>
</section>

<section>
 <h2>การจัดส่ง</h2>
 <label for="delivery">โรงงานส่งหรือส่งเอง</label><select id="delivery"></select>
 <div id="kmBox" class="hide">
  <label for="km">ระยะทางขาไป+ขากลับ (กม.)</label><input id="km" type="number" inputmode="decimal" step="any">
 </div>
 <label for="ship">ต้นทุนขนส่ง (บาท/เที่ยว)</label><input id="ship" readonly value="0">
</section>

<section>
 <h2>ใบเสนอราคา</h2>
 <label for="seller">ชื่อเซล</label><input id="seller" autocomplete="name">
 <label for="quoteNo">เลขที่ใบเสนอราคา</label><input id="quoteNo" autocomplete="off">
 <label for="wh">สินค้าจากคลัง</label><select id="wh"></select>
 <div id="items"></div>
 <button type="button" id="add" class="full">+ เพิ่มรายการสินค้า</button>
 <label for="trips">จำนวนที่แจ้งขนส่งกี่รอบ</label><input id="trips" type="number" inputmode="numeric" min="1" step="1" value="1">
</section>

<section>
 <h2>สรุป</h2>
 <p class="hint">ระบบคำนวณให้ ไม่ต้องกรอก</p>
 <table class="sum" id="sum"></table>
</section>

</main>
<div class="bar"><div><p id="msg"></p><button id="save" type="button">บันทึกข้อมูล</button></div></div>

<script>
const $=id=>document.getElementById(id);
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(x)?0:x};
const fmt=x=>Number(x||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=x=>x<0?'neg':'pos';
const SELF='ส่งเอง';
let items=[{code:'',price:'',cost:'',qty:'',buy:null}];
let shipCost=0,shipSeq=0,statSeq=0,priceSeq=0,saving=false;
const timers={};
const debounce=(k,fn,ms)=>{clearTimeout(timers[k]);timers[k]=setTimeout(fn,ms)};
const API='https://script.google.com/macros/s/AKfycbx06TRpWRuQiXoZ27abrjRgyEO3OUQhxTJcKXMo8wtidjShT4_6-puWO1oLCC6bM64iHg/exec';
const inGAS=typeof google!=='undefined'&&google.script&&google.script.run;
const run=(fn,...a)=>inGAS
 ?new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e.message||e)))[fn](...a))
 :fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a})})
   .then(r=>r.json()).then(j=>{if(j.error)throw new Error(j.error);return j.result});

function fillSelect(id,arr){$(id).innerHTML=arr.map(v=>`<option>${esc(v)}</option>`).join('')}
function isSelf(){return $('delivery').value.trim()===SELF}
function say(t,k){const m=$('msg');m.textContent=t||'';m.className=t?k:''}

/* ---- รายการสินค้า ---- */
function renderItems(){
 $('items').innerHTML=items.map((x,i)=>`
 <div class="item" data-i="${i}">
  <div class="top"><span>รายการที่ ${i+1}</span>${items.length>1?`<button type="button" class="rm" data-del="${i}">ลบ</button>`:''}</div>
  <label>รหัสสินค้า</label><input data-f="code" value="${esc(x.code)}" autocapitalize="characters" autocomplete="off">
  <div class="two">
   <div><label>ราคาที่จะขอขาย/หน่วย</label><input data-f="price" type="number" inputmode="decimal" step="any" value="${esc(x.price)}"></div>
   <div><label>ต้นทุนต่อหน่วย</label><input data-f="cost" type="number" inputmode="decimal" step="any" value="${esc(x.cost)}"></div>
  </div>
  <label>จำนวน</label><input data-f="qty" type="number" inputmode="decimal" step="any" value="${esc(x.qty)}">
  <div class="buy" id="buy${i}"></div>
 </div>`).join('');
 items.forEach((_,i)=>drawBuy(i));
}
function drawBuy(i){
 const x=items[i],el=$('buy'+i);if(!el)return;
 if(!x.code.trim()){el.innerHTML='';return}
 if(x.buy===undefined){el.textContent='กำลังหาราคาจัดซื้อ…';return}
 if(x.buy===null){el.innerHTML='<span class="neg">ไม่พบรหัสนี้ในชีทราคาจัดซื้อ</span>';return}
 const d=(num(x.price)-x.buy)*num(x.qty);
 el.innerHTML=`ราคาจัดซื้อปกติ <b>${fmt(x.buy)}</b>`+(x.price&&x.qty?` · ส่วนต่าง <b class="${cls(d)}">${fmt(d)}</b>`:'');
}
$('items').addEventListener('input',e=>{
 const f=e.target.dataset.f,i=e.target.closest('.item').dataset.i;if(!f)return;
 items[i][f]=e.target.value;
 if(f==='code'){items[i].buy=undefined;drawBuy(i);debounce('price',loadPrices,500)}
 drawBuy(i);recalc();
});
$('items').addEventListener('click',e=>{
 const d=e.target.dataset.del;if(d==null)return;
 items.splice(+d,1);renderItems();recalc();
});
$('add').onclick=()=>{items.push({code:'',price:'',cost:'',qty:'',buy:null});renderItems();
 const last=document.querySelectorAll('.item input[data-f="code"]');last[last.length-1].focus()};

async function loadPrices(){
 const codes=items.map(x=>x.code.trim()).filter(Boolean);if(!codes.length)return;
 const my=++priceSeq;
 try{
  const r=await run('lookupPrices',$('wh').value,codes);
  if(my!==priceSeq)return;
  items.forEach((x,i)=>{const c=x.code.trim();x.buy=c?(r[c]===undefined?null:r[c]):null;drawBuy(i)});
  recalc();
 }catch(e){say('หาราคาจัดซื้อไม่ได้: '+e.message,'bad')}
}
$('wh').onchange=()=>{items.forEach(x=>{if(x.code.trim())x.buy=undefined});renderItems();loadPrices()};

/* ---- สถิติลูกค้า (ข้อ 1-5 ครบ) ---- */
function statsReady(){return $('code').value.trim()&&$('cname').value.trim()&&$('ctype').value&&$('cum').value!==''&&$('cont').value}
function checkStats(){
 if(!statsReady()){$('stats').classList.add('hide');return}
 debounce('stat',async()=>{
  const my=++statSeq;
  $('stats').classList.remove('hide');$('stats').textContent='กำลังอ่านข้อมูล…';
  try{
   const r=await run('getCustomerStats',$('code').value);
   if(my!==statSeq)return;
   $('stats').innerHTML=`รหัส <b>${esc($('code').value.trim())}</b> ขอราคาพิเศษไปแล้ว <b>${fmt(r.count)}</b> ครั้ง<br>ได้ราคาต่างจากราคาจัดซื้อรวม <b class="${cls(r.diff)}">${fmt(r.diff)}</b> บาท`+
    `<div class="hint" style="margin:6px 0 0">นับตามเลขที่ใบเสนอราคาไม่ซ้ำ · ติดลบ = ขายต่ำกว่าราคาจัดซื้อ</div>`;
  }catch(e){$('stats').textContent='อ่านข้อมูลไม่ได้: '+e.message}
 },400);
}
['code','cname','ctype','cum','cont'].forEach(id=>{$(id).addEventListener('input',checkStats);$(id).addEventListener('change',checkStats)});
$('code').addEventListener('input',()=>{statSeq++});

/* ---- ต้นทุนขนส่ง ---- */
function checkShip(){
 const self=isSelf();$('kmBox').classList.toggle('hide',!self);
 if(!self||num($('km').value)<=0){shipSeq++;shipCost=0;$('ship').value=self?'':'0';recalc();return}
 $('ship').value='กำลังคำนวณ…';
 debounce('ship',async()=>{
  const my=++shipSeq;
  try{const c=await run('getShipCost',num($('km').value));if(my!==shipSeq)return;shipCost=c;$('ship').value=fmt(c);recalc()}
  catch(e){if(my===shipSeq){$('ship').value='คำนวณไม่ได้';say(e.message,'bad')}}
 },500);
}
$('delivery').onchange=checkShip;$('km').addEventListener('input',checkShip);

/* ---- สรุป (ข้อ 17-20) ---- */
function calc(){
 const trips=Math.max(1,num($('trips').value));
 let gross=0,diff=0,missing=0;
 items.forEach(x=>{gross+=(num(x.price)-num(x.cost))*num(x.qty);if(typeof x.buy==='number')diff+=(num(x.price)-x.buy)*num(x.qty);else if(x.code.trim())missing++});
 const ship=isSelf()?shipCost:0,perTrip=gross/trips-ship;
 return {trips,gross,ship,perTrip,all:perTrip*trips,diff,missing};
}
function recalc(){
 const c=calc();
 $('sum').innerHTML=
  `<tr><td>กำไรสินค้ารวมทุกรายการ</td><td>${fmt(c.gross)}</td></tr>`+
  `<tr><td>หารจำนวนรอบ (${fmt(c.trips)} รอบ)</td><td>${fmt(c.gross/c.trips)}</td></tr>`+
  `<tr><td>หักต้นทุนขนส่งต่อเที่ยว</td><td>−${fmt(c.ship)}</td></tr>`+
  `<tr class="big"><td>สรุปกำไรต่อเที่ยว</td><td class="${cls(c.perTrip)}">${fmt(c.perTrip)}</td></tr>`+
  `<tr class="big"><td>สรุปกำไรทั้งหมด</td><td class="${cls(c.all)}">${fmt(c.all)}</td></tr>`+
  `<tr class="big"><td>ส่วนต่างจากราคาจัดซื้อรวม</td><td class="${cls(c.diff)}">${fmt(c.diff)}</td></tr>`;
}
$('trips').addEventListener('input',recalc);

/* ---- บันทึก ---- */
function payload(allowMissing){
 return {code:$('code').value,name:$('cname').value,type:$('ctype').value,cum:$('cum').value,cont:$('cont').value,
  delivery:$('delivery').value,km:$('km').value,seller:$('seller').value,quoteNo:$('quoteNo').value,wh:$('wh').value,
  trips:$('trips').value,items:items.map(x=>({code:x.code,price:x.price,cost:x.cost,qty:x.qty})),allowMissing:!!allowMissing};
}
$('save').onclick=async()=>{
 if(saving)return;
 if(isSelf()&&$('ship').value==='กำลังคำนวณ…'){say('รอคำนวณต้นทุนขนส่งก่อน','warn');return}
 saving=true;$('save').disabled=true;say('กำลังบันทึก…','warn');
 try{
  let r=await run('saveRequest',payload(false));
  if(!r.ok){
   if(!confirm('ไม่พบรหัสสินค้าในชีทราคาจัดซื้อ: '+r.missing.join(', ')+'\nจะบันทึกโดยไม่มีราคาจัดซื้อของรายการนี้หรือไม่?')){say('ยกเลิกการบันทึก','warn');return}
   r=await run('saveRequest',payload(true));
  }
  say(`บันทึกแล้ว ${r.rows} แถว · กำไรต่อเที่ยว ${fmt(r.profitTrip)} · กำไรทั้งหมด ${fmt(r.profitAll)} · ส่วนต่างรวม ${fmt(r.diff)}`,'ok');
  try{localStorage.setItem('seller',$('seller').value)}catch(e){}
  resetForm();window.scrollTo({top:0,behavior:'smooth'});
 }catch(e){say(e.message,'bad')}
 finally{saving=false;$('save').disabled=false}
};
function resetForm(){
 ['code','cname','cum','km','quoteNo'].forEach(id=>$(id).value='');
 $('trips').value=1;$('ship').value='0';shipCost=0;
 items=[{code:'',price:'',cost:'',qty:'',buy:null}];
 $('stats').classList.add('hide');$('kmBox').classList.toggle('hide',!isSelf());
 renderItems();recalc();
}

/* ---- เริ่มต้น ---- */
(async()=>{
 renderItems();recalc();
 try{
  const r=await run('getInit'),o=r.options;
  $('dataLink').href=r.dataUrl;
  fillSelect('ctype',o['ประเภทลูกค้า']);fillSelect('cont',o['หน้างานต่อเนื่อง']);
  fillSelect('delivery',o['โรงงานส่งหรือส่งเอง']);fillSelect('wh',o['สินค้าจากคลัง']);
  try{$('seller').value=localStorage.getItem('seller')||''}catch(e){}
  checkShip();
 }catch(e){say('โหลดตัวเลือกไม่ได้: '+e.message,'bad')}
})();
</script></body></html>
