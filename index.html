<!DOCTYPE html>
<html lang="th"><head><base target="_top"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ขอราคาพิเศษ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#14212b;--mute:#52606d;--line:#cbd5df;--acc:#0b5d7a;--acc-ink:#fff;--soft:#e3f1f6;--ok:#146c3a;--okbg:#dff5e8;--bad:#a61b1b;--badbg:#fde4e4;--warnbg:#fff1cf;--warn:#7a5200;
box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--card:#18222b;--ink:#eef3f7;--mute:#a8b6c3;--line:#34444f;--acc:#5cc3e6;--acc-ink:#06232e;--soft:#16323d;--ok:#6fdc9b;--okbg:#12361f;--bad:#ff8f8f;--badbg:#431a1a;--warn:#ffd27a;--warnbg:#3d3010}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Sarabun",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px;max-width:720px;margin:0 auto}
h1{font-size:24px;line-height:1.2;margin:0;font-weight:700}
a.data{flex:none;background:var(--acc);color:var(--acc-ink);text-decoration:none;font-weight:700;padding:10px 18px;border-radius:10px;font-size:16px}
main{max-width:720px;margin:0 auto;padding:8px 16px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 14px}
h2{font-size:19px;margin:0 0 4px;font-weight:700}
.hint{color:var(--mute);font-size:15px;margin:0 0 8px}
label{display:block;font-weight:500;margin:14px 0 5px}
input,select{width:100%;min-height:50px;padding:10px 12px;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input[readonly]{background:var(--soft);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.two{grid-template-columns:1fr}}
.box{border-radius:12px;padding:14px;margin-top:14px;font-size:17px}
.box.info{background:var(--soft)}
.box b{font-size:22px}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.item{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.item .top{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.item .top button{min-height:40px;padding:4px 14px;margin:0}
.buy{margin-top:10px;font-size:16px;color:var(--mute)}
.buy b{color:var(--ink)}
button,a.btn{font:inherit;font-weight:700;min-height:50px;padding:10px 18px;border-radius:10px;border:2px solid var(--acc);background:transparent;color:var(--acc);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.full{width:100%;margin-top:12px}
button.rm{border-color:var(--bad);color:var(--bad)}
.verdict{border-radius:12px;padding:14px;margin:8px 0 6px}
.verdict small{display:block;font-size:15px;font-weight:500}
.verdict b{display:block;font-size:22px;line-height:1.3}
.v-ok{background:var(--okbg);color:var(--ok)}.v-warn{background:var(--warnbg);color:var(--warn)}.v-na{background:var(--soft);color:var(--mute)}
table.sum{width:100%;border-collapse:collapse;margin-top:6px}
table.sum td{padding:9px 0;border-bottom:1px solid var(--line)}
table.sum td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
table.sum tr.big td{font-size:20px;border-bottom:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:720px;margin:0 auto}
.bar .row{display:flex;gap:10px}
#save{flex:1;background:var(--acc);color:var(--acc-ink);font-size:19px;min-height:54px}
#save:disabled{opacity:.5}
#reopen{min-height:54px}
#msg{margin:0 0 8px;padding:10px 12px;border-radius:10px;font-weight:500;display:none}
#msg.ok{display:block;background:var(--okbg);color:var(--ok)}
#msg.bad{display:block;background:var(--badbg);color:var(--bad)}
#msg.warn{display:block;background:var(--warnbg);color:var(--warn)}
.hide{display:none!important}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet{max-width:640px;margin:0 auto;background:var(--card);border-radius:14px;padding:14px}
.sheet img{width:100%;display:block;border-radius:8px;border:1px solid var(--line);background:#fff}
.mrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.mrow>*{flex:1 1 140px}
.mrow .pri{background:var(--acc);color:var(--acc-ink)}
#qsec h2{margin-bottom:2px}.qhint{margin:0 0 10px;color:var(--mute);font-size:15px}
#qlog{height:380px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:12px}
.qm{max-width:92%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;font-size:16px;line-height:1.5;word-break:break-word}
.qm.qwide{max-width:100%;align-self:stretch}
.qb{background:var(--card);border:1px solid var(--line);align-self:flex-start}
.qu{background:var(--acc);color:var(--acc-ink);align-self:flex-end}
#qbar{display:flex;gap:8px;margin-top:10px}#qin{flex:1;min-width:0}#qsend{min-height:50px;margin:0}
.qtw{overflow-x:auto;margin-top:8px}.qtw table{border-collapse:collapse;font-size:15px;width:100%}
.qtw th,.qtw td{border:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap}
.qtw td.l,.qtw th:first-child{text-align:left}
.qtw button{min-height:38px;padding:4px 10px;margin:0;font-size:15px;white-space:nowrap}
.qfoot{margin-top:8px;font-size:15px;color:var(--mute);white-space:pre-wrap}
.qact{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.qact button{min-height:44px;margin:0}
#qsec{--qbg:#fff3e4;--qline:#f1c798;--qacc:#f6a85c;--qink:#3b2200;background:var(--qbg);border-color:var(--qline)}
@media(prefers-color-scheme:dark){#qsec{--qbg:#33261a;--qline:#6a4a2c;--qacc:#e9a35f;--qink:#2b1800}}
#qsec #qlog,#qsec #qin{border-color:var(--qline)}
#qsec .qb{background:var(--card);border-color:var(--qline)}
#qsec .qu{background:var(--qacc);color:var(--qink)}
#qsec #qsend,#qsec .qtw button,#qsec .qact button{background:var(--qacc);color:var(--qink);border-color:var(--qacc)}
#qsec .qtw th{background:var(--qbg);white-space:pre-line;max-width:120px;font-weight:600}
#qsec .qtw th,#qsec .qtw td{border-color:var(--qline)}
#qsec .qact button.green{background:#62c98a;border-color:#62c98a;color:#072a15;font-weight:600}
@media(prefers-color-scheme:dark){#qsec .qact button.green{background:#6fd39a;border-color:#6fd39a;color:#0b2616}}
</style></head><body>
<header><h1>ขอราคาพิเศษ</h1><a class="data" id="dataLink" href="#" target="_blank" rel="noopener">DATA</a></header>
<main>
<section id="qsec">
 <h2>ผู้ช่วย AI</h2>
 <p class="qhint">พิมพ์คุยกับ AI ให้ช่วยคิดราคา หรือจะกรอกฟอร์มด้านล่างเองเลยก็ได้</p>
 <div id="qlog"></div>
 <div id="qbar"><input id="qin" placeholder="พิมพ์ข้อมูลหรือคำตอบที่นี่..." autocomplete="off"><button id="qsend" type="button">ส่ง</button></div>
</section>

<section>
 <h2>ลูกค้า</h2>
 <label for="code">รหัสลูกค้า</label><input id="code" autocomplete="off" autocapitalize="characters">
 <div class="two">
  <div><label for="ctype">ประเภทลูกค้า</label><select id="ctype"></select></div>
  <div><label for="cont">หน้างานต่อเนื่อง</label><select id="cont"></select></div>
 </div>
 <label for="cum">ยอดซื้อสะสม (บาท)</label><input id="cum" type="number" inputmode="decimal" step="any">
 <div id="stats" class="box info hide"></div>
</section>

<section>
 <h2>การจัดส่ง</h2>
 <label for="delivery">โรงงานส่งหรือส่งเอง</label><select id="delivery"></select>
 <div id="kmBox" class="hide">
  <label for="km">ระยะทางขาไป+ขากลับ (กม.)</label><input id="km" type="number" inputmode="decimal" step="any">
 </div>
 <label for="ship">ต้นทุนขนส่ง (บาท/เที่ยว)</label><input id="ship" readonly value="0">
</section>

<section>
 <h2>ใบเสนอราคา</h2>
 <label for="seller">ชื่อเซล</label><input id="seller" autocomplete="name">
 <label for="quoteNo">เลขที่ใบเสนอราคา</label><input id="quoteNo" autocomplete="off">
 <label for="wh">สินค้าจากคลัง</label><select id="wh"></select>
 <div id="items"></div>
 <button type="button" id="add" class="full">+ เพิ่มรายการสินค้า</button>
 <label for="trips">จำนวนที่แจ้งขนส่งกี่รอบ</label><input id="trips" type="number" inputmode="numeric" min="1" step="1" value="1">
</section>

<section>
 <h2>สรุป</h2>
 <p class="hint">ระบบคำนวณให้ ไม่ต้องกรอก</p>
 <div id="verdict" class="verdict v-na"></div>
 <table class="sum" id="sum"></table>
</section>

</main>

<div class="bar"><div>
 <p id="msg"></p>
 <div class="row"><button id="reopen" type="button" class="hide">ดูรูปสรุปล่าสุด</button><button id="save" type="button">บันทึกข้อมูล</button></div>
</div></div>

<div id="modal" class="modal hide" role="dialog" aria-modal="true" aria-label="รูปสรุปขอราคาพิเศษ">
 <div class="sheet">
  <img id="pic" alt="รูปสรุปขอราคาพิเศษ">
  <p class="hint" style="margin:10px 0 0">บนมือถือ ถ้าปุ่มดาวน์โหลดไม่ทำงาน ให้กดค้างที่รูปแล้วเลือกบันทึกรูป</p>
  <div class="mrow">
   <a id="dl" class="btn pri" download="สรุปขอราคาพิเศษ.png" href="#">ดาวน์โหลดรูป</a>
   <button id="share" type="button" class="hide">แชร์รูป</button>
   <button id="close" type="button">ปิด</button>
  </div>
 </div>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbz-vAu_hTksh19hm-WQy_30OkPXbNrNsvo3TFiUo38KlGJLiqoDIRWGHQ2c2RYNisF-Fg/exec';
const $=id=>document.getElementById(id);
const num=v=>{const x=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(x)?0:x};
const fmt=x=>Number(x||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cls=x=>x<0?'neg':'pos';
const SELF='ส่งเอง';
const inGAS=typeof google!=='undefined'&&google.script&&google.script.run;
const getPass=()=>{let p=sessionStorage.getItem('pass');if(!p){p=prompt('รหัสผ่านทีมขาย')||'';if(p)sessionStorage.setItem('pass',p)}return p};
const run=(fn,...a)=>inGAS
 ?new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(new Error(e.message||e)))[fn](...a))
 :fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args:a,pass:getPass()})})
   .then(r=>r.json()).then(j=>{if(j.error){if(j.error.indexOf('รหัสผ่าน')>-1)sessionStorage.removeItem('pass');throw new Error(j.error)}return j.result});

let items=[{code:'',name:'',price:'',cost:'',qty:'',buy:null}];
let shipCost=0,shipSeq=0,shipBusy=false,statSeq=0,priceSeq=0,saving=false,rules=[],lastImg=null;
const timers={};
const debounce=(k,fn,ms)=>{clearTimeout(timers[k]);timers[k]=setTimeout(fn,ms)};

function fillSelect(id,arr){$(id).innerHTML=arr.map(v=>`<option>${esc(v)}</option>`).join('')}
function isSelf(){return $('delivery').value.trim()===SELF}
function say(t,k){const m=$('msg');m.textContent=t||'';m.className=t?k:''}

/* ---- หลักเกณฑ์ (อ่านจากชีท "หลักเกณฑ์") ---- */
const OPS={'≥':(a,b)=>a>=b,'>=':(a,b)=>a>=b,'≤':(a,b)=>a<=b,'<=':(a,b)=>a<=b,'<':(a,b)=>a<b,'>':(a,b)=>a>b,'=':(a,b)=>a===b};
function cmp(t,val){const m=t.match(/(≥|>=|≤|<=|<|>|=)\s*([\d,]+(?:\.\d+)?)/);return m?OPS[m[1]](val,parseFloat(m[2].replace(/,/g,''))):false}
function condOk(t,c){
 t=String(t).trim();if(!t)return true;
 if(t.indexOf('ประเภทลูกค้า')===0)return c.type.trim()===t.replace('ประเภทลูกค้า','').trim();
 if(t.indexOf('ยอดซื้อสะสม')>-1)return cmp(t,c.cum);
 if(t.indexOf('กำไร')>-1)return cmp(t,c.profit);
 if(t.indexOf('หน้างาน')>-1)return c.cont.trim()===(/ไม่/.test(t)?'ไม่ใช่':'ใช่');
 if(t==='โรงงานส่ง'||t==='ส่งเอง')return c.delivery.trim()===t;
 return false;
}
function evaluate(c){
 for(const r of rules){if(r.conds.every(t=>condOk(t,c)))return {text:`${r.result} (${r.name})`,ok:r.result.indexOf('ส่งพิจารณา')<0}}
 return {text:'ไม่เข้าเกณฑ์ ส่งพิจารณา',ok:false};
}

/* ---- รายการสินค้า ---- */
function renderItems(){
 $('items').innerHTML=items.map((x,i)=>`
 <div class="item" data-i="${i}">
  <div class="top"><span>รายการที่ ${i+1}</span>${items.length>1?`<button type="button" class="rm" data-del="${i}">ลบ</button>`:''}</div>
  <label>รหัสสินค้า</label><input data-f="code" value="${esc(x.code)}" autocapitalize="characters" autocomplete="off">
  <div class="two">
   <div><label>ราคาที่จะขอขาย/หน่วย</label><input data-f="price" type="number" inputmode="decimal" step="any" value="${esc(x.price)}"></div>
   <div><label>ต้นทุนต่อหน่วย</label><input data-f="cost" type="number" inputmode="decimal" step="any" value="${esc(x.cost)}"></div>
  </div>
  <label>จำนวน</label><input data-f="qty" type="number" inputmode="decimal" step="any" value="${esc(x.qty)}">
  <div class="buy" id="buy${i}"></div>
 </div>`).join('');
 items.forEach((_,i)=>drawBuy(i));
}
function drawBuy(i){
 const x=items[i],el=$('buy'+i);if(!el)return;
 if(!x.code.trim()){el.innerHTML='';return}
 if(x.buy===undefined){el.textContent='กำลังหาชื่อสินค้าและราคาจัดซื้อ…';return}
 if(x.buy===null){el.innerHTML='<span class="neg">ไม่พบรหัสนี้ในชีทราคาจัดซื้อ</span>';return}
 const d=(num(x.price)-x.buy)*num(x.qty);
 el.innerHTML=(x.name?`ชื่อสินค้า <b>${esc(x.name)}</b><br>`:'')+`ราคาจัดซื้อปกติ <b>${fmt(x.buy)}</b>`+(x.price&&x.qty?` · ส่วนต่าง <b class="${cls(d)}">${fmt(d)}</b>`:'');
}
$('items').addEventListener('input',e=>{
 const f=e.target.dataset.f,i=e.target.closest('.item').dataset.i;if(!f)return;
 items[i][f]=e.target.value;
 if(f==='code'){items[i].buy=undefined;items[i].name='';drawBuy(i);debounce('price',loadPrices,500)}
 drawBuy(i);recalc();
});
$('items').addEventListener('click',e=>{
 const d=e.target.dataset.del;if(d==null)return;
 items.splice(+d,1);renderItems();recalc();
});
$('add').onclick=()=>{items.push({code:'',name:'',price:'',cost:'',qty:'',buy:null});renderItems();
 const last=document.querySelectorAll('.item input[data-f="code"]');last[last.length-1].focus()};

async function loadPrices(){
 const codes=items.map(x=>x.code.trim()).filter(Boolean);if(!codes.length)return;
 const my=++priceSeq;
 try{
  const r=await run('lookupPrices',$('wh').value,codes);
  if(my!==priceSeq)return;
  items.forEach((x,i)=>{const c=x.code.trim(),p=c?r[c]:null;x.buy=p?p.buy:null;x.name=p?p.name:'';drawBuy(i)});
  recalc();
 }catch(e){say('หาราคาจัดซื้อไม่ได้: '+e.message,'bad')}
}
$('wh').onchange=()=>{items.forEach(x=>{if(x.code.trim())x.buy=undefined});renderItems();loadPrices()};

/* ---- สถิติลูกค้า (ข้อ 1-5 ครบ) ---- */
function statsReady(){return $('code').value.trim()&&$('ctype').value&&$('cum').value!==''&&$('cont').value}
function checkStats(){
 if(!statsReady()){$('stats').classList.add('hide');return}
 debounce('stat',async()=>{
  const my=++statSeq;
  $('stats').classList.remove('hide');$('stats').textContent='กำลังอ่านข้อมูล…';
  try{
   const r=await run('getCustomerStats',$('code').value);
   if(my!==statSeq)return;
   $('stats').innerHTML=`รหัส <b>${esc($('code').value.trim())}</b> ขอราคาพิเศษไปแล้ว <b>${fmt(r.count)}</b> ครั้ง<br>ได้ราคาต่างจากราคาจัดซื้อรวม <b class="${cls(r.diff)}">${fmt(r.diff)}</b> บาท`+
    `<div class="hint" style="margin:6px 0 0">นับเฉพาะใบเสนอราคาที่อนุมัติแล้ว · ติดลบ = ขายต่ำกว่าราคาจัดซื้อ</div>`;
  }catch(e){$('stats').textContent='อ่านข้อมูลไม่ได้: '+e.message}
 },400);
}
['code','ctype','cum','cont'].forEach(id=>{$(id).addEventListener('input',checkStats);$(id).addEventListener('change',checkStats)});
$('code').addEventListener('input',()=>{statSeq++});

/* ---- ต้นทุนขนส่ง ---- */
function checkShip(){
 const self=isSelf();$('kmBox').classList.toggle('hide',!self);
 if(!self||num($('km').value)<=0){shipSeq++;shipBusy=false;shipCost=0;$('ship').value=self?'':'0';recalc();return}
 $('ship').value='กำลังคำนวณ…';shipBusy=true;recalc();
 debounce('ship',async()=>{
  const my=++shipSeq;
  try{const c=await run('getShipCost',num($('km').value));if(my!==shipSeq)return;shipCost=c;shipBusy=false;$('ship').value=fmt(c);recalc()}
  catch(e){if(my===shipSeq){shipBusy=false;$('ship').value='คำนวณไม่ได้';say(e.message,'bad')}}
 },500);
}
$('delivery').onchange=checkShip;$('km').addEventListener('input',checkShip);

/* ---- สรุป (ข้อ 17-20) + ผลอนุมัติเบื้องต้น ---- */
function calc(){
 const trips=Math.max(1,num($('trips').value));
 let gross=0,diff=0;
 items.forEach(x=>{gross+=(num(x.price)-num(x.cost))*num(x.qty);if(typeof x.buy==='number')diff+=(num(x.price)-x.buy)*num(x.qty)});
 const ship=isSelf()?shipCost:0,perTrip=gross/trips-ship;
 return {trips,gross,ship,perTrip,all:perTrip*trips,diff};
}
function ctx(profit){return {type:$('ctype').value,delivery:$('delivery').value,cum:num($('cum').value),cont:$('cont').value,profit}}
function ready(){
 return $('cum').value!==''&&items.some(x=>num(x.price)>0&&num(x.qty)>0)&&!shipBusy&&(!isSelf()||num($('km').value)>0)&&rules.length>0;
}
function recalc(){
 const c=calc(),v=$('verdict');
 if(ready()){const r=evaluate(ctx(c.perTrip));v.className='verdict '+(r.ok?'v-ok':'v-warn');v.innerHTML=`<small>ผลอนุมัติเบื้องต้น</small><b>${esc(r.text)}</b>`}
 else{v.className='verdict v-na';v.innerHTML='<small>ผลอนุมัติเบื้องต้น</small><b>กรอกข้อมูลให้ครบเพื่อดูผล</b>'}
 $('sum').innerHTML=

}
['trips','cum','ctype','cont'].forEach(id=>{$(id).addEventListener('input',recalc);$(id).addEventListener('change',recalc)});

/* ---- รูปสรุป ---- */
function rr(x,X,Y,W,H,R){x.beginPath();if(x.roundRect)x.roundRect(X,Y,W,H,R);else x.rect(X,Y,W,H);x.fill()}
function drawSummary(x,W,s){
 const P=36,F="'Sarabun','Noto Sans Thai',system-ui,sans-serif";
 const T=(t,X,Y,o={})=>{x.font=`${o.w||400} ${o.s||30}px ${F}`;x.fillStyle=o.c||'#14212b';x.textAlign=o.a||'left';x.textBaseline='alphabetic';
  let str=String(t);if(o.max){while(x.measureText(str).width>o.max&&str.length>1)str=str.slice(0,-1);if(str!==String(t))str=str.slice(0,-1)+'…'}x.fillText(str,X,Y)};
 const money=v=>v==null?'-':fmt(v);
 const col=v=>v==null?'#14212b':(v<0?'#a61b1b':'#146c3a');
 let y=0;
 x.fillStyle='#fff';x.fillRect(0,0,W,6000);
 x.fillStyle='#0b5d7a';x.fillRect(0,0,W,150);
 T('สรุปขอราคาพิเศษ',P,66,{s:50,w:700,c:'#fff'});
 T(`วันที่ ${s.date}   เวลา ${s.time}`,P,118,{s:34,c:'#e3f1f6'});
 y=176;
 const vc=s.verdict.ok?'#146c3a':'#7a5200';
 x.fillStyle=s.verdict.ok?'#dff5e8':'#fff1cf';rr(x,P,y,W-2*P,150,16);
 T('ผลอนุมัติเบื้องต้น',P+26,y+48,{s:30,c:vc});
 T(s.verdict.text,P+26,y+112,{s:46,w:700,c:vc,max:W-2*P-52});
 y+=150+40;
 const sec=t=>{T(t,P,y+38,{s:40,w:700,c:'#0b5d7a'});x.fillStyle='#cbd5df';x.fillRect(P,y+54,W-2*P,3);y+=80};
 const kv=list=>{const cw=(W-2*P)/2;list.forEach((k,i)=>{const X=P+(i%2)*cw,Y=y+Math.floor(i/2)*96;
   T(k[0],X,Y+30,{s:28,c:'#52606d',max:cw-12});T(k[1],X,Y+74,{s:38,w:700,max:cw-12,c:k[2]||'#14212b'})});
  y+=Math.ceil(list.length/2)*96+18};
 sec('ลูกค้า');
 kv([['รหัสลูกค้า',s.code],['ประเภทลูกค้า',s.type],['หน้างานต่อเนื่อง',s.cont],['ยอดซื้อสะสม (บาท)',fmt(s.cum)],
  ['ขอราคาพิเศษไปแล้ว (ครั้ง)',s.stats?fmt(s.stats.count):'-'],['ส่วนต่างราคาจัดซื้อสะสม (บาท)',s.stats?fmt(s.stats.diff):'-',s.stats?col(s.stats.diff):null]]);
 sec('ใบเสนอราคาและการจัดส่ง');
 kv([['เลขที่ใบเสนอราคา',s.quoteNo],['ชื่อเซล',s.seller],['สินค้าจากคลัง',s.wh],['โรงงานส่ง/ส่งเอง',s.delivery],
  ['ระยะทางไป+กลับ (กม.)',s.delivery.trim()===SELF?fmt(s.km):'-'],['ต้นทุนขนส่ง (บาท/เที่ยว)',fmt(s.ship)],['จำนวนรอบขนส่ง',fmt(s.trips)]]);
 sec('รายการสินค้า');
 const cw3=(W-2*P-40)/3;
 s.items.forEach((it,i)=>{
  const H=262;
  x.fillStyle=i%2?'#f4f7f9':'#ffffff';rr(x,P,y,W-2*P,H,14);
  x.strokeStyle='#cbd5df';x.lineWidth=2;x.beginPath();if(x.roundRect)x.roundRect(P+1,y+1,W-2*P-2,H-2,14);else x.rect(P+1,y+1,W-2*P-2,H-2);x.stroke();
  const L=P+20;
  x.font=`700 38px ${F}`;const cwid=x.measureText(it.code).width;
  T(it.code,L,y+56,{s:38,w:700});
  if(it.name)T(it.name,L+cwid+22,y+56,{s:32,max:W-P-20-(L+cwid+22),c:'#14212b'});
  const cell=(c,r,label,val,color)=>{const X=L+c*cw3,Y=y+r*92;T(label,X,Y+104,{s:26,c:'#52606d'});T(val,X,Y+146,{s:36,w:700,c:color||'#14212b',max:cw3-10})};
  cell(0,0,'ราคาขอขาย',fmt(it.price));cell(1,0,'ต้นทุน',fmt(it.cost));cell(2,0,'จำนวน',fmt(it.qty));
  cell(0,1,'ราคาจัดซื้อ',money(it.buy));cell(1,1,'ส่วนต่าง',money(it.diff),col(it.diff));
  y+=H+16;
 });
 y+=14;
 sec('สรุปกำไร');
 [['กำไรต่อเที่ยว (หลังหักค่าขนส่ง)',s.profitTrip],['กำไรทั้งหมด',s.profitAll],['ส่วนต่างจากราคาจัดซื้อรวม',s.diff]].forEach(r=>{
  T(r[0],P,y+46,{s:32,max:W-2*P-250});T(fmt(r[1]),W-P,y+50,{s:46,w:700,a:'right',c:col(r[1])});y+=82});
 y+=18;
 T('ผลอนุมัติเบื้องต้นคำนวณจากหลักเกณฑ์ในระบบ',P,y+26,{s:24,c:'#52606d'});
 y+=64;
 return y;
}
async function buildImage(s){
 try{await Promise.all([document.fonts.load('400 24px Sarabun'),document.fonts.load('700 24px Sarabun')])}catch(e){}
 const W=900,S=2,probe=document.createElement('canvas').getContext('2d');
 const H=drawSummary(probe,W,s),c=document.createElement('canvas');
 c.width=W*S;c.height=H*S;const x=c.getContext('2d');x.scale(S,S);drawSummary(x,W,s);
 const blob=await new Promise(ok=>c.toBlob(ok,'image/png'));
 return {url:c.toDataURL('image/png'),blob,name:`สรุปขอราคาพิเศษ_${s.quoteNo}.png`};
}
function showImg(){
 if(!lastImg)return;
 $('pic').src=lastImg.url;$('dl').href=lastImg.url;$('dl').download=lastImg.name;
 const f=new File([lastImg.blob],lastImg.name,{type:'image/png'});
 $('share').classList.toggle('hide',!(navigator.canShare&&navigator.canShare({files:[f]})));
 $('modal').classList.remove('hide');
}
$('close').onclick=()=>$('modal').classList.add('hide');
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.add('hide')});
$('reopen').onclick=showImg;
$('share').onclick=async()=>{try{await navigator.share({files:[new File([lastImg.blob],lastImg.name,{type:'image/png'})],title:'สรุปขอราคาพิเศษ'})}catch(e){}};

/* ---- บันทึก ---- */
function payload(allowMissing){
 return {code:$('code').value,type:$('ctype').value,cum:$('cum').value,cont:$('cont').value,
  delivery:$('delivery').value,km:$('km').value,seller:$('seller').value,quoteNo:$('quoteNo').value,wh:$('wh').value,
  trips:$('trips').value,items:items.map(x=>({code:x.code,price:x.price,cost:x.cost,qty:x.qty})),allowMissing:!!allowMissing};
}
$('save').onclick=async()=>{
 if(saving)return;
 if(shipBusy){say('รอคำนวณต้นทุนขนส่งก่อน','warn');return}
 saving=true;$('save').disabled=true;say('กำลังบันทึก…','warn');
 const p=payload(false),sn=items.filter(x=>x.code.trim()).map(x=>({code:x.code.trim(),price:num(x.price),cost:num(x.cost),qty:num(x.qty)}));
 try{
  let r=await run('saveRequest',p);
  if(!r.ok){
   if(!confirm('ไม่พบรหัสสินค้าในชีทราคาจัดซื้อ: '+r.missing.join(', ')+'\nจะบันทึกโดยไม่มีราคาจัดซื้อของรายการนี้หรือไม่?')){say('ยกเลิกการบันทึก','warn');return}
   r=await run('saveRequest',payload(true));
  }
  say('บันทึกแล้ว กำลังสร้างรูปสรุป…','ok');
  let stats=null;try{stats=await run('getCustomerStats',p.code)}catch(e){}
  const verdict=rules.length?evaluate(ctx(r.profitTrip)):{text:'-',ok:false};
  const s={date:r.date,time:r.time,verdict,code:p.code.trim(),type:p.type.trim(),cont:p.cont.trim(),cum:num(p.cum),stats,
   quoteNo:p.quoteNo.trim(),seller:p.seller.trim(),wh:p.wh.trim(),delivery:p.delivery.trim(),km:num(p.km),ship:r.ship,trips:num(p.trips),
   items:sn.map((x,i)=>({...x,name:r.lines[i].name,buy:r.lines[i].buy,diff:r.lines[i].diff})),profitTrip:r.profitTrip,profitAll:r.profitAll,diff:r.diff};
  try{lastImg=await buildImage(s);$('reopen').classList.remove('hide');showImg();
   say(`บันทึกแล้ว ${r.rows} แถว · กำไรต่อเที่ยว ${fmt(r.profitTrip)} · กำไรทั้งหมด ${fmt(r.profitAll)}`,'ok')}
  catch(e){say('บันทึกแล้ว แต่สร้างรูปไม่ได้: '+e.message,'warn')}
  try{localStorage.setItem('seller',$('seller').value)}catch(e){}
  resetForm();
 }catch(e){say(e.message,'bad')}
 finally{saving=false;$('save').disabled=false}
};
function resetForm(){
 ['code','cum','km','quoteNo'].forEach(id=>$(id).value='');
 $('trips').value=1;$('ship').value='0';shipCost=0;shipBusy=false;
 items=[{code:'',name:'',price:'',cost:'',qty:'',buy:null}];
 $('stats').classList.add('hide');$('kmBox').classList.toggle('hide',!isSelf());
 renderItems();recalc();
}

/* ---- เริ่มต้น ---- */
(async()=>{
 renderItems();recalc();
 try{
  const r=await run('getInit'),o=r.options;
  rules=r.rules||[];
  $('dataLink').href=r.dataUrl;
  fillSelect('ctype',o['ประเภทลูกค้า']);fillSelect('cont',o['หน้างานต่อเนื่อง']);
  fillSelect('delivery',o['โรงงานส่งหรือส่งเอง']);fillSelect('wh',o['สินค้าจากคลัง']);
  try{$('seller').value=localStorage.getItem('seller')||''}catch(e){}
  checkShip();recalc();
 }catch(e){say('โหลดตัวเลือกไม่ได้: '+e.message,'bad')}
})();
</script><!-- ===== ผู้ช่วย AI (สคริปต์) ===== -->
<script>
const QAPI='https://script.google.com/macros/s/AKfycbz-vAu_hTksh19hm-WQy_30OkPXbNrNsvo3TFiUo38KlGJLiqoDIRWGHQ2c2RYNisF-Fg/exec';
let qstate={items:[]},qbusy=false;
const qlog=document.getElementById('qlog'),qin=document.getElementById('qin');
const qpass=()=>{let p=sessionStorage.getItem('pass');if(!p){p=prompt('รหัสผ่านทีมขาย')||'';if(p)sessionStorage.setItem('pass',p)}return p};
function qadd(t,me){const d=document.createElement('div');d.className='qm '+(me?'qu':'qb');d.textContent=t;qlog.appendChild(d);qlog.scrollTop=qlog.scrollHeight;return d}
function qbtn(label,fn,cls){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;if(cls)b.className=cls;return b}
function qtable(t,box){
 const w=document.createElement('div');w.className='qtw';const tb=document.createElement('table');
 const hr=tb.insertRow();t.head.concat(['']).forEach(h=>{const c=document.createElement('th');c.textContent=h;hr.appendChild(c)});
 t.rows.forEach(r=>{const tr=tb.insertRow();const c0=tr.insertCell();c0.textContent=r.label;c0.className='l';
  r.cells.forEach(x=>{tr.insertCell().textContent=x});tr.insertCell().textContent=r.profit;
  tr.insertCell().appendChild(qbtn('ขายราคานี้',()=>qsend('เลือกขั้น '+r.n,'ขายราคานี้ ('+r.label.replace('⭐ ','')+')')))});
 w.appendChild(tb);box.appendChild(w);
 if(t.foot){const f=document.createElement('div');f.className='qfoot';f.textContent=t.foot.join('\n');box.appendChild(f)}
}
async function qsend(text,shown){
 if(qbusy)return;
 const m=(text!==undefined?text:qin.value).trim();if(!m)return;
 if(text===undefined)qin.value='';
 qadd(shown||m,true);const w=qadd('กำลังคิด... (รอสักครู่)');qbusy=true;
 try{
  const j=await (await fetch(QAPI,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:'chat',args:[m,qstate],pass:qpass()})})).json();
  if(j.error){w.textContent=j.error;if(j.error.indexOf('รหัสผ่าน')>-1)sessionStorage.removeItem('pass');return}
  const r=j.result;qstate=r.state||{items:[]};w.textContent=r.reply;
  if(r.table){w.classList.add('qwide');qtable(r.table,w)}
  if(r.buttons){const bar=document.createElement('div');bar.className='qact';r.buttons.forEach(b=>bar.appendChild(qbtn(b.label,()=>qsend(b.send,b.label),b.cls)));w.appendChild(bar)}
  if(r.saved){try{lastImg=await buildImage(r.saved);$('reopen').classList.remove('hide');showImg()}
   catch(e){w.appendChild(document.createTextNode('\n(สร้างรูปสรุปไม่ได้: '+e.message+')'))}}
 }catch(e){w.textContent='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'}
 finally{qbusy=false;qlog.scrollTop=qlog.scrollHeight}
}
{const g=qadd('สวัสดีครับ เลือกได้เลย หรือพิมพ์ถามตรงๆ ก็ได้\n\n• ถามราคา/ต้นทุน เช่น ต้นทุนขนส่ง 40 กม., ราคาคู่แข่งของรหัสสินค้า, ส่งเองหรือโรงงานส่งถูกกว่า\n• ทำใบขอราคาพิเศษ ระบบจะถามข้อมูลลูกค้ากับสินค้า แล้วทำรูปสรุปให้\n\nไม่ใช้ AI ก็ได้ กรอกฟอร์มด้านล่างได้เลย พิมพ์ "เริ่มใหม่" เพื่อล้างข้อมูลเมื่อไหร่ก็ได้');
const bar=document.createElement('div');bar.className='qact';
bar.appendChild(qbtn('ถามราคา/ต้นทุน',()=>{qadd('ถามได้เลยครับ เช่น\n• ต้นทุนขนส่ง 40 กม.\n• รหัส 140402 ราคาเท่าไหร่ คู่แข่งเท่าไหร่\n• ส่งเอง 40 กม. กับโรงงานส่ง แบบไหนถูกกว่า\n• ขาย 60 ทุน 45 จำนวน 200 ส่งเอง 30 กม. 2 รอบ กำไรเท่าไหร่')}));
bar.appendChild(qbtn('ทำใบขอราคาพิเศษ',()=>qsend('ทำใบขอราคาพิเศษ','ทำใบขอราคาพิเศษ'),'green'));
g.appendChild(bar)}
document.getElementById('qsend').onclick=()=>qsend();
qin.addEventListener('keydown',e=>{if(e.key==='Enter')qsend()});
</script>
